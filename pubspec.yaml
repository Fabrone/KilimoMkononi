name: kilimomkononi
description: "Kilimo Mkononi - Smart farming made easier."
publish_to: 'none' 

version: 1.0.5+6
environment:
  sdk: ^3.9.0  # aligned with Dart 3.9.2 from Flutter 3.35.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  carousel_slider: ^5.0.0
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.0.2
  logger: ^2.5.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  flutter_local_notifications: ^19.4.1
  shared_preferences: ^2.3.2
  fl_chart: ^1.1.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  universal_html: ^2.2.4
  flutter_image_compress: ^2.3.0
  timezone: ^0.10.1
  vector_math: ^2.1.4
  http: ^1.2.2
  uuid: ^4.4.0
  intl: ^0.20.2
  firebase_storage: ^13.0.1
  permission_handler: ^12.0.1
  open_file: ^3.5.10
  file_picker: ^10.3.3
  dio: ^5.9.0
  lottie: ^3.3.2
  rxdart: ^0.28.0
  confetti: ^0.8.0
  share_plus: ^12.0.1
  flutter_markdown: ^0.6.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/farm_management.jpg
    - assets/farming_tips.png
    - assets/field_data_collection.jpg
    - assets/manuals.jpg
    - assets/pest_management.jpg
    - assets/soil.png
    - assets/weather_forecast.jpg
    - assets/pests/
    - assets/diseases/
    - assets/
    - assets/data/master.json
    - assets/lottie/
    - assets/lottie/images/
    - assets/farming_tips/
    - assets/market_tips/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.jpg"